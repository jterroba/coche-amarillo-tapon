<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0b1326"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="120" y1="140" x2="392" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ec6a06"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="170" y1="165" x2="342" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dark asphalt background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle glowing road halo -->
  <circle cx="256" cy="245" r="170" fill="#fbbf24" fill-opacity="0.12"/>

  <!-- Road horizon & dashed markings -->
  <path d="M56 382 L456 382" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <path d="M116 414 L176 414 M226 414 L286 414 M336 414 L396 414" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="8" stroke-linecap="round"/>

  <!-- Car Roof & Cabin -->
  <path d="M148 228 L178 156 C185 140 200 132 218 132 L294 132 C312 132 327 140 334 156 L364 228 Z" fill="url(#carGrad)"/>
  <!-- Windshield -->
  <path d="M174 222 L195 166 C199 156 208 150 220 150 L292 150 C304 150 313 156 317 166 L338 222 Z" fill="url(#glassGrad)"/>
  <!-- Windshield glint -->
  <path d="M204 162 L236 162 L212 214 L188 214 Z" fill="#ffffff" fill-opacity="0.14"/>

  <!-- Car Body -->
  <rect x="92" y="218" width="328" height="106" rx="34" fill="url(#carGrad)"/>
  <!-- Lower bumper shadow -->
  <rect x="108" y="294" width="296" height="22" rx="11" fill="#b45309" fill-opacity="0.45"/>

  <!-- Headlights -->
  <circle cx="136" cy="264" r="20" fill="#fffbeb"/>
  <circle cx="136" cy="264" r="12" fill="#fde047"/>
  <circle cx="376" cy="264" r="20" fill="#fffbeb"/>
  <circle cx="376" cy="264" r="12" fill="#fde047"/>

  <!-- Front Grille -->
  <rect x="192" y="250" width="128" height="28" rx="14" fill="#131b2e"/>
  <rect x="210" y="260" width="92" height="8" rx="4" fill="#fbbf24" fill-opacity="0.75"/>

  <!-- Wheels -->
  <rect x="112" y="314" width="54" height="44" rx="14" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <rect x="346" y="314" width="54" height="44" rx="14" fill="#0f172a" stroke="#334155" stroke-width="4"/>

  <!-- Side Mirrors -->
  <rect x="74" y="206" width="28" height="18" rx="9" fill="#fbbf24"/>
  <rect x="410" y="206" width="28" height="18" rx="9" fill="#fbbf24"/>

  <!-- Gold Star Sparkle (+pts) -->
  <path d="M406 88 L414 108 L434 116 L414 124 L406 144 L398 124 L378 116 L398 108 Z" fill="#fde047"/>
</svg>
